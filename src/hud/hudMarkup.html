<!--
  In-match HUD markup (was in index.html): injected by the HUD runtime
  (src/hud/runtime/HudRuntime.ts) into the HUD document — hud.html, the
  iframe laid over the game canvas — or, in inline mode, into the game page
  itself. The widgets (src/ui/*) look their elements up by id, and the ones
  they create are appended here or to <body>, as before.
  The debug panel (#debug) stays in index.html: DebugHUD measures the game
  page's own thread.
-->
<div id="hud" class="menu-active">
  <div id="phase-overlay"></div>
  <div id="damage-vignette"></div>
  <div id="lowhp-vignette"></div>
  <div id="heal-flash"></div>
  <div id="damage-dir-container"></div>
  <div id="crosshair" class="sticker"></div>

  <!-- The ONLY info allowed near the aim point: a tiny contextual hint
       (LOW AMMO / RELOAD) that exists only while it matters. -->
  <div id="aim-ticker"></div>

  <!-- Top-centre: mode badge, the combo tag hanging under it, then the
       event feed (BEANED! / killstreak READY stickers). -->
  <div id="top-center">
    <div id="mode-hud">
      <span id="mode-name">FFA</span>
      <span class="mode-sep"></span>
      <svg class="mode-icon" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="9.8" fill="none" stroke="currentColor" stroke-width="2.6" />
        <path d="M12 6.8V12l3.4 2" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
      <span id="mode-time" class="mt-inf">∞</span>
    </div>
    <div id="combo-hud">
      <div id="combo-tag">
        <span class="combo-string left"></span>
        <span class="combo-string right"></span>
        <span id="combo-label">COMBO</span>
        <span id="combo-count">x1</span>
        <div id="combo-rope"><div id="combo-fill"></div></div>
      </div>
    </div>
    <div id="event-feed"></div>
  </div>

  <!-- Bottom-left: the BEAN BUDDY player card — die-cut cream portrait
       sticker (face = HP mood), name tag, charcoal HP pill "79 /100" +
       lime tube with the damage "ghost", and the cyan dash pill
       "» E READY" (the pill fills up during the cooldown).
       Portrait art + name are injected by CombatHUD (hudIcons.ts). -->
  <div id="bean-buddy" class="mood-happy">
    <div class="buddy-frame">
      <div class="buddy-rays"></div>
      <div id="buddy-portrait"></div>
      <div class="buddy-sparkles"><i></i><i></i><i></i><i></i><i></i></div>
    </div>
    <div class="buddy-panel">
      <div id="buddy-name">PLAYER</div>
      <div id="health-hud" class="full">
        <div id="health-num"><span id="health-value">100</span><span id="health-max">/100</span></div>
        <div id="health-bar">
          <div id="health-ghost"></div>
          <div id="health-fill"></div>
          <div class="bar-ticks"></div>
          <div class="bar-shine"></div>
        </div>
        <div id="heal-feedback" class="hidden">+35</div>
      </div>
      <div id="dash-hud" class="ready">
        <div id="dash-bar">
          <div id="dash-fill"></div>
          <div class="bar-shine"></div>
        </div>
        <span class="dash-chevrons"><i></i><i></i></span>
        <span class="hud-key">E</span>
        <div id="dash-status">READY</div>
      </div>
    </div>
  </div>

  <!-- Bottom-right column: KILLSTREAK capsules (injected on top by
       KillstreakHUD), then the weapon plate + ability chips. Each *HUD
       class mounts its own plate / chip; only the equipped ones show. -->
  <div id="right-hud-col">
    <div id="weapon-row">
      <div id="ability-slot"></div>
      <div id="weapon-slot"></div>
    </div>
  </div>

  <!-- Medal sticker badge (KILL / DOUBLE KILL / HEADSHOT…) under the
       top-centre stack. Content is built once by MedalHUD. -->
  <div id="medal-display" class="hidden"></div>

  <!-- Leaderboard: cream tab + five separate capsules. Rows, crown and
       particles are created once by LeaderboardHUD (src/ui/leaderboard/). -->
  <div id="leaderboard-hud" class="hidden">
    <div class="lb-head"><div class="lb-title">CLASSEMENT</div><span class="lb-dot"></span></div>
    <div id="lb-list"></div>
  </div>

  <!-- Knockdown banner: bottom-centre, above the controls hint. -->
  <div id="knockdown-hint" class="hidden">KNOCKED DOWN</div>

  <div id="death-screen" class="hidden">
    <div id="death-title">YOU DIED</div>
    <div id="death-respawn">Respawning… <span id="death-timer">2.5</span></div>
  </div>

  <div id="controls-hint">WASD Move · SPACE Jump · SHIFT Slide · E Dash · LMB Fire · R Respawn</div>
</div>
